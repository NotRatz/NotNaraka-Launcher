<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheater Backfill Tool</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #FF4757;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff6b81;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #0f0;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #f00;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Cheater Backfill Tool</h2>
        <p style="color:#aaa; font-size:0.9rem;">Add historical detections to the database. <br><b>Discord Webhooks are
                DISABLED for these entries.</b></p>

        <div class="tab-bar" style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">
            <button onclick="switchTab('single')"
                style="width: auto; background: transparent; color: #fff; border: 1px solid #444; margin-right: 10px;">Single
                Entry</button>
            <button onclick="switchTab('bulk')"
                style="width: auto; background: #FF4757; color: white; border: none;">Bulk Import (Logs)</button>
        </div>

        <!-- SINGLE ENTRY -->
        <div id="single-mode" style="display:none;">
            <label>In-Game Name (IGN)</label>
            <input type="text" id="ign" placeholder="e.g. Cheater123">

            <label>UID (Required)</label>
            <input type="text" id="uid" placeholder="e.g. 8800123456">

            <label>Reason</label>
            <select id="reason">
                <option value="Integrity Violation">Integrity Violation</option>
                <option value="Suspicious Gameplay">Suspicious Gameplay</option>
                <option value="Software Detection">Software Detection</option>
                <option value="Manual Report">Manual Report</option>
            </select>

            <label>Date Detected (Optional)</label>
            <input type="datetime-local" id="date">

            <label>Detection Count (Overrides default)</label>
            <input type="number" id="count" placeholder="1" value="1" min="1">

            <button onclick="submitCheater()">Add to Database</button>
        </div>

        <!-- BULK IMPORT -->
        <div id="bulk-mode">
            <label>Paste Raw Logs Here (🚨 CHEAT DETECTED...)</label>
            <textarea id="rawLogs" rows="10"
                style="width:100%; background:#222; color:#ccc; border:1px solid #444; padding:10px; margin-bottom:10px;"
                placeholder="Paste the full discord/log text here..."></textarea>

            <button onclick="parseLogs()" style="margin-bottom:20px; background:#444;">Parse Logs</button>

            <div id="preview" style="margin-bottom:20px;"></div>

            <button onclick="uploadBulk()" id="btnUploadBulk" style="display:none;">Upload ALL Parsed Entries</button>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script>
        const API_URL = "https://notnaraka-api.bmcnaughton0.workers.dev/cheaters";
        let parsedEntries = [];

        function switchTab(mode) {
            document.getElementById('single-mode').style.display = mode === 'single' ? 'block' : 'none';
            document.getElementById('bulk-mode').style.display = mode === 'bulk' ? 'block' : 'none';

            // Update button styles
            const singleBtn = document.querySelector('.tab-bar button:nth-child(1)');
            const bulkBtn = document.querySelector('.tab-bar button:nth-child(2)');

            if (mode === 'single') {
                singleBtn.style.background = '#FF4757';
                singleBtn.style.border = 'none';
                bulkBtn.style.background = 'transparent';
                bulkBtn.style.border = '1px solid #444';
            } else {
                bulkBtn.style.background = '#FF4757';
                bulkBtn.style.border = 'none';
                singleBtn.style.background = 'transparent';
                singleBtn.style.border = '1px solid #444';
            }
        }

        function parseLogs() {
            const text = document.getElementById('rawLogs').value;
            const entries = [];

            // Normalize text: remove carriage returns
            const cleanText = text.replace(/\r/g, '');

            // Split by "🚨" to separate entries
            const blocks = cleanText.split('🚨').filter(b => b.trim().length > 10);

            blocks.forEach(block => {
                let ign = "Unknown";
                let uid = null;
                let reason = "Integrity Violation";
                let date = new Date().toISOString();

                // Format A: "CHEAT DETECTED" (Older/Legacy)
                if (block.includes("User Identity") || block.includes("Steam Username")) {
                    const ignMatch = block.match(/Steam Username\s*\n(.+)/);
                    if (ignMatch) ign = ignMatch[1].trim();

                    const uidMatch = block.match(/All Steam IDs\s*\n(\d+)/); // Take first ID
                    if (uidMatch) uid = uidMatch[1].trim();

                    const dateMatch = block.match(/Detection Time\s*\n(.+)/);
                    if (dateMatch) date = new Date(dateMatch[1].trim()).toISOString();

                    if (block.includes("Detected '")) {
                        const reasonMatch = block.match(/Detected '([^']+)'/);
                        if (reasonMatch) reason = "Detected: " + reasonMatch[1];
                    }
                }

                // Format B: "Threat Detected: Critical" (Newer)
                if (block.includes("Threat Detected: Critical") || block.includes("Game Username")) {
                    const ignMatch = block.match(/Game Username\s*\n(.+)/);
                    if (ignMatch) ign = ignMatch[1].trim();

                    // Try converting Steam Profile [U:1:1844509642] to API format if needed, or just keep raw
                    // Regex for [U:1:XXXX]
                    const uidMatch = block.match(/\[U:1:(\d+)\]/);
                    if (uidMatch) uid = uidMatch[1]; // Use the ID inside brackets

                    const dateMatch = block.match(/Timestamp\s*\n(.+)/);
                    if (dateMatch) date = new Date(dateMatch[1].trim()).toISOString();

                    const reasonMatch = block.match(/Suspected (.+) detected/);
                    if (reasonMatch) reason = "Suspicious Component: " + reasonMatch[1].split('(')[0].trim();
                }

                if (uid) {
                    entries.push({ ign, uid, reason, detected_at: date, raw_report: "Bulk Import", silent: true });
                }
            });

            parsedEntries = entries;
            renderPreview();
        }

        function renderPreview() {
            const container = document.getElementById('preview');
            if (parsedEntries.length === 0) {
                container.innerHTML = '<div style="color:#f55;">No valid entries found. Make sure logs contain "Steam Username" / "Game Username" and valid IDs.</div>';
                document.getElementById('btnUploadBulk').style.display = 'none';
                return;
            }

            let html = '<table style="width:100%; border-collapse:collapse; font-size:0.8rem;">';
            html += '<tr style="background:#333; text-align:left;"><th>IGN</th><th>UID</th><th>Reason</th><th>Date</th></tr>';
            parsedEntries.forEach(e => {
                html += `<tr style="border-bottom:1px solid #444;">
                    <td style="padding:5px;">${e.ign}</td>
                    <td style="padding:5px;">${e.uid}</td>
                    <td style="padding:5px;">${e.reason}</td>
                    <td style="padding:5px;">${e.detected_at.substring(0, 10)}</td>
                </tr>`;
            });
            html += '</table>';

            container.innerHTML = html;
            document.getElementById('btnUploadBulk').style.display = 'block';
            document.getElementById('btnUploadBulk').textContent = `Upload ${parsedEntries.length} Entries`;
        }

        async function uploadBulk() {
            const btn = document.getElementById('btnUploadBulk');
            btn.disabled = true;
            btn.textContent = "Uploading...";

            let successCount = 0;
            let failCount = 0;

            for (const entry of parsedEntries) {
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(entry)
                    });
                    const data = await res.json();
                    if (data.success) successCount++;
                    else failCount++;
                } catch (e) {
                    failCount++;
                }
            }

            showStatus(`Upload Complete! Success: ${successCount}, Failed: ${failCount}`, failCount === 0);
            btn.textContent = "Done";
        }

        async function submitCheater() {
            const ign = document.getElementById('ign').value;
            const uid = document.getElementById('uid').value;
            const reason = document.getElementById('reason').value;
            const dateInput = document.getElementById('date').value;
            const countInput = document.getElementById('count').value;
            const statusDiv = document.getElementById('status');

            if (!uid) {
                showStatus("UID is required", false);
                return;
            }

            const payload = {
                ign: ign,
                uid: uid,
                reason: reason,
                detected_at: dateInput ? new Date(dateInput).toISOString() : new Date().toISOString(),
                raw_report: "Manual Backfill",
                silent: true, // Prevents Discord Webhook
                manual_count: parseInt(countInput) || 1
            };

            statusDiv.style.display = 'none';

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (data.success) {
                    showStatus("Successfully Added: " + ign, true);
                    document.getElementById('ign').value = '';
                    document.getElementById('uid').value = '';
                } else {
                    showStatus("Error: " + (data.error || "Unknown"), false);
                }
            } catch (e) {
                showStatus("Connection Error: " + e.message, false);
            }
        }

        function showStatus(msg, isSuccess) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + (isSuccess ? 'success' : 'error');
            el.style.display = 'block';
        }
    </script>
</body>

</html>
